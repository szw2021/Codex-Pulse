<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Codex Pulse 刘海状态</title>
  <link rel="stylesheet" href="notch-status.css">
</head>
<body>
  <button class="notch-status" id="notch-status" data-state="idle" aria-label="打开 Codex Pulse">
    <span class="status-mark" id="status-mark" aria-hidden="true">·</span>
    <span class="status-copy">
      <strong id="status-label">Codex Pulse</strong>
      <small id="status-detail">正在读取会话状态…</small>
    </span>
    <span class="status-count" id="status-count" hidden></span>
  </button>
  <script src="tauri-bridge.js"></script>
  <script src="notch-status.js"></script>
</body>
</html>
