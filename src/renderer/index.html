<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Codex Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="header" id="drag-region">
      <span class="health-dot" id="health-dot" aria-hidden="true"></span>
      <div class="heading">
        <h1>Codex Pulse</h1>
        <p id="subtitle">正在读取本机会话…</p>
      </div>
      <span class="mode-badge" id="yolo-badge" hidden>YOLO</span>
      <button class="round-button" id="refresh-button" title="立即刷新" aria-label="立即刷新">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 11V5m0 6h-6"/></svg>
      </button>
      <div class="menu-wrap">
        <button class="round-button" id="menu-button" aria-label="菜单">•••</button>
        <div class="menu" id="menu" hidden>
          <button id="yolo-toggle" class="mode-toggle" role="switch" aria-checked="false">
            <span class="menu-copy"><strong>YOLO 模式</strong><small>跳过审批与沙箱</small></span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <div class="menu-setting">
            <strong id="session-title-mode-label">会话显示</strong>
            <div class="menu-segmented" role="group" aria-labelledby="session-title-mode-label">
              <button type="button" data-session-title-mode="prompt" aria-pressed="true">最后提问</button>
              <button type="button" data-session-title-mode="title" aria-pressed="false">标题</button>
            </div>
          </div>
          <div class="menu-divider"></div>
          <button id="manage-remote-menu">管理远程服务器</button>
          <div class="menu-divider"></div>
          <button data-menu-action="hide">隐藏悬浮窗</button>
          <button data-menu-action="quit" class="danger">退出 Codex Pulse</button>
        </div>
      </div>
    </header>

    <div class="controls">
      <nav class="source-switch" aria-label="会话来源">
        <button class="selected" data-source="local"><span class="source-dot local"></span>本地</button>
        <button data-source="remote"><span class="source-dot remote"></span>远程</button>
      </nav>

      <section class="remote-toolbar" id="remote-toolbar" hidden>
        <select id="remote-filter" aria-label="远程服务器"><option value="all">全部服务器</option></select>
        <button id="manage-remote-button" title="管理远程服务器" aria-label="管理远程服务器">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg>
        </button>
      </section>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search-input" type="search" autocomplete="off" placeholder="搜索会话或项目">
      </label>
    </div>

    <nav class="tabs" aria-label="状态筛选">
      <button class="selected" data-filter="all">全部 <span id="count-all">0</span></button>
      <button data-filter="active">进行 <span id="count-active">0</span></button>
      <button data-filter="completed_pending">新完成 <span id="count-completed_pending">0</span></button>
      <button data-filter="attention">审批 <span id="count-attention">0</span></button>
      <button data-filter="failed">失败 <span id="count-failed">0</span></button>
      <button data-filter="completed">完成 <span id="count-completed">0</span></button>
    </nav>

    <main class="content" id="content">
      <div class="empty loading" id="empty-state">
        <div class="empty-icon">&gt;_</div>
        <strong>正在同步 Codex</strong>
        <span>首次读取可能需要几秒钟</span>
        <button class="empty-action" id="empty-action" hidden></button>
      </div>
      <div class="session-list" id="session-list"></div>
    </main>

    <div class="modal-backdrop" id="remote-modal" hidden>
      <section class="remote-dialog" role="dialog" aria-modal="true" aria-labelledby="remote-dialog-title">
        <header>
          <div><strong id="remote-dialog-title">远程服务器</strong></div>
          <button id="remote-modal-close" aria-label="关闭">×</button>
        </header>
        <form id="remote-form">
          <input id="remote-host-input" autocomplete="off" spellcheck="false" placeholder="SSH 别名，例如 dev-server">
          <button type="submit">添加</button>
        </form>
        <p class="remote-form-error" id="remote-form-error" hidden></p>
        <div class="remote-list-heading"><span>已添加</span></div>
        <div class="remote-host-list" id="remote-host-list"></div>
        <div class="remote-list-heading"><span>从 ~/.ssh/config 发现</span><button id="reload-ssh-hosts">重新读取</button></div>
        <div class="discovered-host-list" id="discovered-host-list"></div>
      </section>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
