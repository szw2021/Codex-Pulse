name: Open Pull Request

on:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Open Pull Request when missing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          count=$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq 'length')
          if [[ "$count" == "0" ]]; then
            git fetch origin main
            title=$(git log -1 --format=%s)
            summary=$(git log origin/main..HEAD --pretty='- %s')
            body=$(printf '## Changes\n\n%s\n\n## Verification\n\nRequired Pull Request checks must pass before merge.\n' "$summary")
            if ! create_output=$(gh pr create \
              --repo "$REPOSITORY" \
              --head "$BRANCH" \
              --base main \
              --title "$title" \
              --body "$body" 2>&1); then
              create_output=${create_output//$'\n'/ }
              echo "::error title=Unable to create Pull Request::$create_output"
              exit 1
            fi
          fi
